name: Mobile Tests - iOS Contacts

on:
  workflow_dispatch:
    inputs:
      description:
        description: "Reason for running tests"
        required: false
        default: "Manual trigger"

jobs:
  test:
    name: Run Mobile Tests
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: "mobile/package-lock.json"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "26"
          distribution: "temurin"

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      - name: Verify Appium and Drivers
        run: |
          cd mobile
          npx appium driver list
          npx appium --version

      - name: Start iOS Simulator
        run: |
          # List available devices
          echo "Available iOS devices:"
          xcrun simctl list devices
          # Boot the iOS simulator
          UDID=$(xcrun simctl list devices | grep "iPhone" | grep -v "Booted" | head -1 | awk '{print $(NF-1)}' | tr -d '()')
          if [ -n "$UDID" ]; then
            echo "Booting simulator: $UDID"
            xcrun simctl boot "$UDID"
            sleep 15
            # Verify simulator is booted
            if xcrun simctl list devices | grep "$UDID" | grep -q "Booted"; then
              echo "Simulator $UDID is now booted"
            else
              echo "Failed to boot simulator $UDID"
              exit 1
            fi
          else
            echo "No iOS simulator found"
            exit 1
          fi

      - name: Set UDID in Config
        run: |
          cd mobile
          # Get the booted iPhone simulator UDID
          UDID=$(xcrun simctl list devices | grep "iPhone" | grep "Booted" | head -1 | awk '{print $(NF-1)}' | tr -d '()')
          if [ -n "$UDID" ]; then
            echo "Using UDID: $UDID"
            # Replace the hardcoded UDID in config.ts with the actual one
            sed -i "s/'appium:udid': '.*'/'appium:udid': '$UDID'/" src/config/config.ts
          else
            echo "No booted iPhone simulator found"
            exit 1
          fi

      - name: Start Appium Server
        run: |
          cd mobile
          npx appium server -p 4723 --base-path / --allow-insecure '*':all --log-level debug > /tmp/appium.log 2>&1 &
          APPIUM_PID=$!
          echo "Appium PID: $APPIUM_PID"
          echo "Appium log file location: /tmp/appium.log"
          # Wait for Appium to be ready
          for i in {1..24}; do
            if curl -s http://127.0.0.1:4723/status > /dev/null 2>&1; then
              echo "Appium is ready on port 4723"
              break
            fi
            echo "Waiting for Appium... ($i/24)"
            sleep 5
          done
          if ! curl -s http://127.0.0.1:4723/status > /dev/null 2>&1; then
            echo "Appium failed to start"
            echo "=== Appium logs ==="
            cat /tmp/appium.log
            echo "=== End Appium logs ==="
            exit 1
          fi

      - name: Run Mobile Tests
        run: |
          cd mobile
          npm run test

      - name: Stop Appium Server
        if: always()
        run: |
          pkill -f appium || true

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-html-report
          path: mobile/mochawesome-report/
          retention-days: 30
