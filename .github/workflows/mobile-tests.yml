name: Mobile Tests - iOS Calculator

on:
  workflow_dispatch:
    inputs:
      description:
        description: 'Reason for running tests'
        required: false
        default: 'Manual trigger'

jobs:
  test:
    name: Run Mobile Tests
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      - name: Start iOS Simulator
        run: |
          # Boot the iOS simulator
          UDID=$(xcrun simctl list devices | grep "iPhone" | grep -v "Booted" | head -1 | awk '{print $(NF-1)}' | tr -d '()')
          if [ -n "$UDID" ]; then
            echo "Booting simulator: $UDID"
            xcrun simctl boot "$UDID"
            sleep 10
          else
            echo "No iOS simulator found"
            exit 1
          fi

      - name: Start Appium Server
        run: |
          cd mobile
          npx appium server -p 4723 --base-path / > /tmp/appium.log 2>&1 &
          APPIUM_PID=$!
          echo "Appium PID: $APPIUM_PID"
          # Wait for Appium to be ready
          for i in {1..12}; do
            if curl -s http://127.0.0.1:4723/status > /dev/null 2>&1; then
              echo "Appium is ready on port 4723"
              break
            fi
            echo "Waiting for Appium... ($i/12)"
            sleep 5
          done
          if ! curl -s http://127.0.0.1:4723/status > /dev/null 2>&1; then
            echo "Appium failed to start"
            echo "Appium logs:"
            cat /tmp/appium.log
            exit 1
          fi

      - name: Run Mobile Tests
        run: |
          cd mobile
          npm run test

      - name: Stop Appium Server
        if: always()
        run: |
          pkill -f appium || true

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-html-report
          path: mobile/reports/
          retention-days: 30
